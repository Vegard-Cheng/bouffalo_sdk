name: BL616 Nethub Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-bl616:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils python3 python3-pip
        pip install pyserial

    - name: Download Nuclei RISC-V Toolchain
      run: |
        wget https://github.com/Nuclei-Software/nuclei-sdk/releases/download/2022.04/nuclei_riscv_gnu_toolchain_ubuntu64_202204.tar.xz
        mkdir -p /opt/nuclei_toolchain
        tar -xf nuclei_riscv_gnu_toolchain_ubuntu64_202204.tar.xz -C /opt/nuclei_toolchain
        echo "/opt/nuclei_toolchain/nuclei_riscv_gnu_toolchain/bin" >> $GITHUB_PATH

    - name: Build BL616 nethub example
      run: |
        cd examples/nethub/bl616
        make

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      with:
        name: bl616-nethub-firmware
        path: examples/nethub/bl616/build/*.bin
