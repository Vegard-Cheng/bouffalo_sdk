name: BL616 Nethub Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-bl616:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils make gcc
        pip install pyserial

    - name: Download Nuclei RISC-V Toolchain
      run: |
        wget https://github.com/Nuclei-Software/nuclei-sdk/releases/download/2022.04/nuclei_riscv_gnu_toolchain_ubuntu64_202204.tar.xz
        mkdir -p /opt/nuclei_toolchain
        tar -xf nuclei_riscv_gnu_toolchain_ubuntu64_202204.tar.xz -C /opt/nuclei_toolchain
        echo "/opt/nuclei_toolchain/nuclei_riscv_gnu_toolchain/bin" >> $GITHUB_PATH

    - name: Verify toolchain
      run: |
        which riscv-nuclei-elf-gcc || echo "Toolchain not found!"
        riscv-nuclei-elf-gcc --version || echo "Toolchain version check failed!"

    - name: Build BL616 nethub example
      run: |
        cd examples/nethub/bl616
        make || { echo "Build failed with exit code $?"; exit 1; }

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: bl616-nethub-firmware
        path: examples/nethub/bl616/build/*.bin
